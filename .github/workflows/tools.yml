name: tools

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch: # Allows manual triggering


jobs:
  iwyu:
    timeout-minutes: 60

    env:
      IWYU_VERSION: "0.25"
      LLVM_VERSION: "20"

    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v5
    - name: Install llvm/clang
      run: |
        sudo wget -O ./llvm.sh https://apt.llvm.org/llvm.sh \
            && sudo chmod +x ./llvm.sh \
            && ./llvm.sh ${LLVM_VERSION} all \
            && rm ./llvm.sh

    - name: Compile iwyu
      working-directory: raktr
      run: |
        git clone https://github.com/include-what-you-use/include-what-you-use.git --branch ${IWYU_VERSION} --depth 1
        mkdir include-what-you-use/build
        cd include-what-you-use/build
        cmake -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
              -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
              -DCMAKE_INSTALL_PREFIX=./ \
              .
        make -j4
        bin/include-what-you-use --version

    - name: Compile tests
      working-directory: raktr
      run: |
        export PATH=$PATH:${GITHUB_WORKSPACE}/build/include-what-you-use/build/bin
        cmake -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
              -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
              -DIWYU_ENABLED=ON \
              -DCMAKE_CXX_INCLUDE_WHAT_YOU_USE="include-what-you-use;-Xiwyu;--mapping_file=${GITHUB_WORKSPACE}/raktr.imp;-Xiwyu;--no_fwd_decls;-Xiwyu;--verbose=1" \
              .
        make -j4

